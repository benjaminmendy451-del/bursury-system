{% extends "bursary/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="narrow">
<h1>Log in</h1>
<div class="card">
  <form method="post" novalidate>
    {% csrf_token %}
    {% if locked_message %}<ul class="errorlist"><li>{{ locked_message }}</li></ul>{% endif %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted"><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
  <p class="muted">New here? <a href="{% url 'register' %}">Create a student account</a>.</p>
</div>
</div>
{% endblock %}
